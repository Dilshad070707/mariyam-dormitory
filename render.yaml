services:
  - type: web
    name: mariyam-dormitory
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mariyam-dormitory-db
          property: connectionString
databases:
  - name: mariyam-dormitory-db
    plan: free
    databaseName: mariyam_dormitory
    user: mariyam_app
